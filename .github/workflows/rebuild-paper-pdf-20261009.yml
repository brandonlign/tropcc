name: Rebuild paper PDF

on:
  push:
    paths:
      - '.github/workflows/rebuild-paper-pdf-20261009.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manuscript PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tropcc.tex
          working_directory: paper
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Verify and commit PDF
        run: |
          test -s paper/tropcc.pdf
          grep -F '\topic{AI declaration.}' paper/tropcc.tex
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/tropcc.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild manuscript PDF with AI declaration'
            git push
          fi
