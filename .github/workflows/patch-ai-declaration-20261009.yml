name: Patch AI declaration

on:
  push:
    paths:
      - '.github/workflows/patch-ai-declaration-20261009.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add AI declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paper/tropcc.tex')
          text = p.read_text()
          anchor = "\\topic{Author contributions.} Brandon Li developed the research and computational proof and prepared the manuscript. Ethan Yeroushalmi helped frame the mathematical arguments and contributed to drafting and revising the manuscript.\n\n\\appendix"
          replacement = "\\topic{Author contributions.} Brandon Li developed the research and computational proof and prepared the manuscript. Ethan Yeroushalmi helped frame the mathematical arguments and contributed to drafting and revising the manuscript.\n\n\\topic{AI declaration.} The authors used generative AI tools, including OpenAI ChatGPT and Anthropic Claude, to assist with literature discovery, manuscript drafting and editing, code generation and review, and exploratory proof development. AI-generated outputs were not treated as mathematical evidence or computational certificates. All claims, citations, code, computations, and mathematical arguments presented in the manuscript were reviewed and verified by the authors, who take full responsibility for the final content.\n\n\\appendix"
          if 'AI declaration.' in text:
              raise SystemExit('AI declaration already present; no patch needed')
          if anchor not in text:
              raise SystemExit('Expected author-contributions anchor not found')
          p.write_text(text.replace(anchor, replacement, 1))
          PY
          grep -F '\topic{AI declaration.}' paper/tropcc.tex

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra latexmk

      - name: Rebuild manuscript PDF
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error tropcc.tex
          test -s tropcc.pdf
          rm -f tropcc.aux tropcc.fdb_latexmk tropcc.fls tropcc.log tropcc.out

      - name: Commit updated manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/tropcc.tex paper/tropcc.pdf
          git diff --cached --check
          git commit -m 'Add generative AI declaration to manuscript'
          git push
